{% extends "base.html" %}
{% block title %}Регіони — Портал бригад ЗСУ{% endblock %}
{% block content %}
    <h1>Регіони</h1>
    <table>
        <thead><tr><th>Регіон</th><th>Локацій</th></tr></thead>
        <tbody>
            {% for r in regions %}
                <tr>
                    <td>{{ r.region_name }}</td>
                    <td>{{ r.location_count }}</td>
                </tr>
            {% else %}
                <tr><td colspan="2">Регіонів ще не додано.</td></tr>
            {% endfor %}
        </tbody>
    </table>
    <div class="actions">
        <a href="/locations">← До списку локацій</a>
    </div>
{% endblock %}
