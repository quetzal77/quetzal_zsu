<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Портал бригад ЗСУ{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
{% set path = request.url.path %}
<header class="topbar">
  <div class="topbar__accent"></div>
  <div class="topbar__inner">
    <a class="brand" href="/brigades">
      <span class="brand__mark">ЗСУ</span>
      <span class="brand__name">Збройні сили України</span>
    </a>
    <nav class="nav">
      <a href="/brigades"   class="{{ 'is-active' if path.startswith('/brigades') }}">Бригади</a>
      <a href="/battles"    class="{{ 'is-active' if path.startswith('/battles') }}">Битви</a>
      <a href="/equipment"  class="{{ 'is-active' if path.startswith('/equipment') }}">Спорядження</a>
      <a href="/traditions" class="{{ 'is-active' if path.startswith('/traditions') }}">Традиції</a>
      <a href="/stats"      class="{{ 'is-active' if path.startswith('/stats') }}">Статистика</a>
    </nav>
    <div class="topbar__right">
      <form class="search" method="get" action="/brigades">
        <input name="q" value="{{ request.query_params.get('q','') }}" placeholder="Пошук за назвою / №…">
      </form>
      <a class="btn-primary" href="/brigades/new">＋ Додати бригаду</a>
      <button class="menu-toggle" type="button" aria-label="Меню"
              onclick="document.getElementById('mmenu').classList.toggle('is-open')">☰</button>
    </div>
  </div>
  <div class="mobile-menu" id="mmenu">
    <a href="/brigades">Бригади</a>
    <a href="/battles">Битви</a>
    <a href="/equipment">Спорядження</a>
    <a href="/traditions">Традиції</a>
    <a href="/stats">Статистика</a>
    <form class="search" method="get" action="/brigades">
      <input name="q" placeholder="Пошук за назвою / №…">
    </form>
    <a class="btn-primary" href="/brigades/new">＋ Додати бригаду</a>
  </div>
</header>

<main>
  {% block content %}{% endblock %}

  <footer>
    <span>Портал бригад ЗСУ · довідковий ресурс</span>
    <span class="mono">FastAPI · SQLite</span>
  </footer>
</main>
</body>
</html>
